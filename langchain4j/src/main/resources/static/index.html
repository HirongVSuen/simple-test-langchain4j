<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep AI</title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/ext/client-side-templates.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/common.min.js"></script>

  <link rel="stylesheet" href="/css/main.css" />

  <!--
    关键：main.js 必须在 Alpine 之前执行，否则 alpine:init 监听器注册太晚，
    x-data="chat()" / x-data="sessionTabs()" 会找不到组件。
    两者都是 defer/module，按文档顺序执行，因此这里先引 main.js。
  -->
  <script type="module" src="/js/main.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-base-100 text-base-content">
  <div x-data="sessionTabs()" x-cloak class="flex flex-col h-full">

    <!-- 顶栏（内联：与标签状态耦合） -->
    <header class="navbar bg-base-100 border-b border-base-300 px-5 flex-shrink-0 min-h-12">
      <div class="flex-1">
        <span class="text-lg font-semibold text-primary">Deep AI</span>
      </div>
      <div class="flex-none">
        <button class="btn btn-circle btn-ghost btn-sm" @click="addSession()" title="新会话">+</button>
      </div>
    </header>

    <!-- 标签栏：标签与关闭键用 daisyUI 的 join 拼成一个整体，不留缝 -->
    <div class="flex items-center gap-2 px-2 py-2 border-b border-base-300 overflow-x-auto flex-shrink-0">
      <template x-for="s in sessions" :key="s.id">
        <div class="join flex-shrink-0">
          <button type="button"
                  class="btn btn-sm join-item"
                  :class="isActive(s.id) ? 'btn-primary' : 'btn-ghost'"
                  @click="activeId = s.id"
                  x-text="s.title"></button>
          <button type="button"
                  class="btn btn-sm join-item w-8 px-0"
                  :class="isActive(s.id) ? 'btn-primary opacity-80 hover:opacity-100' : 'btn-ghost'"
                  @click="closeSession(s.id)"
                  :disabled="sessions.length === 1"
                  title="关闭"
                  aria-label="关闭会话">×</button>
        </div>
      </template>
    </div>

    <!-- 会话容器：所有实例挂载，x-show 只切可见性 -->
    <div class="flex-1 relative overflow-hidden">
      <template x-for="s in sessions" :key="s.id">
        <div x-show="isActive(s.id)" class="absolute inset-0">
          <chat-session :data-memory-id="s.id">
            <div hx-get="/fragments/chat-session.html"
                 hx-trigger="load"
                 hx-target="this"
                 hx-swap="innerHTML"
                 class="h-full"></div>
          </chat-session>
        </div>
      </template>
    </div>
  </div>
</body>
</html>
